<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>About Me - Gerald Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 1. 讓背景透明，才能看到 index.html 的粒子 */
        body {
            background: transparent !important;
            padding: 100px 10% 10px; 
            color: white;
            font-family: 'Noto Sans TC', sans-serif;
            
            /* 2. 針對手機端：隱藏滾動條但保持滾動功能 (Firefox & IE) */
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
        }

        /* 3. 針對手機端：隱藏滾動條 (Chrome, Safari, iOS) */
        body::-webkit-scrollbar {
            display: none;
        }

        /* 4. 社群圖標容器樣式 */
        .social-links {
            margin-top: 20px; 
            display: flex;
            align-items: center;
            gap: 25px; /* 這裡控制 Email 和 LinkedIn 圖標之間的距離 */
        }

        /* 5. 圖標基礎樣式與動畫過渡 */
        .social-icon {
            color: white; 
            transition: color 0.3s ease, transform 0.3s ease; 
            display: inline-flex;
            text-decoration: none;
        }

        /* 6. LinkedIn 專屬懸停特效 (品牌藍) */
        .icon-linkedin:hover {
            color: #0077b5; 
            transform: scale(1.15); 
        }

        /* 7. Email 專屬懸停特效 (Gmail 紅) */
        .icon-email:hover {
            color: #ea4335; 
            transform: scale(1.15); 
        }
    </style>
</head>
