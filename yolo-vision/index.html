<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YOLO Edge Vision System</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  
  <style>
    /* 延續科幻深藍與白色背光特效 */
    body {
      background-color: #050a1f;
      background-image: radial-gradient(circle at center, #0a1128 0%, #010308 100%);
      color: #00e5ff;
      font-family: 'Segoe UI', 'Orbitron', sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0;
    }
    .container {
      background: rgba(10, 25, 65, 0.7); border: 1px solid #00e5ff; border-radius: 12px;
      padding: 30px; box-shadow: 0 0 20px rgba(0, 229, 255, 0.2);
      text-align: center; backdrop-filter: blur(8px); max-width: 800px;
    }
    .backlight-text {
      color: #f0f8ff; letter-spacing: 2px; font-size: 1.5em; font-weight: bold;
      text-shadow: 0 0 5px rgba(255,255,255,0.9), 0 0 15px rgba(255,255,255,0.6), 0 0 30px rgba(0,229,255,0.6);
    }
    /* 自訂檔案上傳按鈕 */
    input[type="file"] {
      background: rgba(0, 229, 255, 0.05); border: 1px dashed #00e5ff; padding: 10px;
      color: #a0c4ff; border-radius: 6px; cursor: pointer; margin-bottom: 20px;
    }
    /* 畫布容器：用來疊加圖片與預測框 */
    .canvas-container {
      position: relative; display: inline-block; margin-top: 20px;
      border: 1px solid rgba(0, 229, 255, 0.5); padding: 5px; background: rgba(0, 0, 0, 0.3);
    }
    /* 顯示上傳的圖片 */
    #image-source { max-width: 640px; max-height: 640px; display: none; }
    /* 用來畫預測框的透明畫布 */
    #overlay-canvas { position: absolute; top: 5px; left: 5px; pointer-events: none; }
    #status { margin-top: 15px; font-size: 0.9em; color: #ffeb3b; }
  </style>
</head>
<body>

  <div class="container">
    <p class="backlight-text">EDGE COMPUTING: YOLO SYSTEM</p>
    
    <input type="file" id="upload-input" accept="image/*">
    <div id="status">SYSTEM STANDBY. Waiting for model initialization...</div>

    <div class="canvas-container" id="display-area" style="display:none;">
      <img id="image-source" alt="Input Image">
      <canvas id="overlay-canvas"></canvas>
    </div>
  </div>

  <script>
    const inputElement = document.getElementById('upload-input');
    const imageSource = document.getElementById('image-source');
    const overlayCanvas = document.getElementById('overlay-canvas');
    const statusText = document.getElementById('status');
    const displayArea = document.getElementById('display-area');

    let session; // 存放 ONNX 模型的變數

    // YOLO 模型的類別字典 (COCO 80 類)
    const yoloClasses = [
      "person", "bicycle", "car", "motorcycle", "airplane", "bus", "train", "truck", "boat",
      "traffic light", "fire hydrant", "stop sign", "parking meter", "bench", "bird", "cat", "dog",
      "horse", "sheep", "cow", "elephant", "bear", "zebra", "giraffe", "backpack", "umbrella",
      "handbag", "tie", "suitcase", "frisbee", "skis", "snowboard", "sports ball", "kite",
      "baseball bat", "baseball glove", "skateboard", "surfboard", "tennis racket", "bottle",
      "wine glass", "cup", "fork", "knife", "spoon", "bowl", "banana", "apple", "sandwich",
      "orange", "broccoli", "carrot", "hot dog", "pizza", "donut", "cake", "chair", "couch",
      "potted plant", "bed", "dining table", "toilet", "tv", "laptop", "mouse", "remote",
      "keyboard", "cell phone", "microwave", "oven", "toaster", "sink", "refrigerator", "book",
      "clock", "vase", "scissors", "teddy bear", "hair drier", "toothbrush"
    ];

    // 1. 初始化並載入模型
    async function loadModel() {
      try {
        statusText.innerText = "INITIALIZING NEURAL NETWORK (Downloading .onnx)...";
        session = await ort.InferenceSession.create('./best.onnx');
        statusText.innerText = "SYSTEM ONLINE. Please upload an image.";
        statusText.style.color = "#00e5ff";
      } catch (e) {
        statusText.innerText = "ERROR: Failed to load model. Check console.";
        statusText.style.color = "#ff4c4c";
        console.error(e);
      }
    }

    // 2. 處理圖片上傳
    inputElement.addEventListener('change', (e) => {
      if (!session) {
        alert("模型尚未載入完成，請稍候！"); return;
      }
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (event) => {
        imageSource.src = event.target.result;
        imageSource.style.display = 'block';
        displayArea.style.display = 'inline-block';
        
        imageSource.onload = () => {
          runInference();
        };
      };
      reader.readAsDataURL(file);
    });

    // 3. 執行推論 (完整 AI 核心版：包含張量處理與 NMS)
    async function runInference() {
      statusText.innerText = "ANALYZING IMAGE (Preprocessing)...";
      statusText.style.color = "#ffeb3b";
      
      try {
        // --- 步驟 A：影像預處理 ---
        const modelWidth = 640;
        const modelHeight = 640;
        
        const tmpCanvas = document.createElement('canvas');
        tmpCanvas.width = modelWidth;
        tmpCanvas.height = modelHeight;
        const tmpCtx = tmpCanvas.getContext('2d');
        tmpCtx.drawImage(imageSource, 0, 0, modelWidth, modelHeight);
        const imgData = tmpCtx.getImageData(0, 0, modelWidth, modelHeight).data;

        const red = [], green = [], blue = [];
        for (let i = 0; i < imgData.length; i += 4) {
          red.push(imgData[i] / 255.0);
          green.push(imgData[i + 1] / 255.0);
          blue.push(imgData[i + 2] / 255.0);
        }
        const float32Data = new Float32Array([...red, ...green, ...blue]);
        const inputTensor = new ort.Tensor('float32', float32Data, [1, 3, modelWidth, modelHeight]);

        // --- 步驟 B：執行模型推論 ---
        statusText.innerText = "ANALYZING IMAGE (Running Inference)...";
        const feeds = {};
        feeds[session.inputNames[0]] = inputTensor; 
        const results = await session.run(feeds);
        const output = results[session.outputNames[0]].data;

        // --- 步驟 C：後處理與 NMS ---
        statusText.innerText = "ANALYZING IMAGE (Decoding Tensors)...";
        let boxes = [];
        const confidenceThreshold = 0.3; 
        const iouThreshold = 0.45;       

        for (let i = 0; i < 8400; i++) {
          let maxClassScore = 0;
          let classIndex = -1;

          for (let c = 0; c < 80; c++) {
            let score = output[(4 + c) * 8400 + i];
            if (score > maxClassScore) {
              maxClassScore = score;
              classIndex = c;
            }
          }

          if (maxClassScore > confidenceThreshold) {
            let cx = output[0 * 8400 + i];
            let cy = output[1 * 8400 + i];
            let w = output[2 * 8400 + i];
            let h = output[3 * 8400 + i];

            let xRatio = imageSource.clientWidth / modelWidth;
            let yRatio = imageSource.clientHeight / modelHeight;
            
            let x = (cx - w / 2) * xRatio;
            let y = (cy - h / 2) * yRatio;
            let boxW = w * xRatio;
            let boxH = h * yRatio;

            boxes.push({ x, y, w: boxW, h: boxH, score: maxClassScore, classId: classIndex });
          }
        }

        boxes = boxes.sort((a, b) => b.score - a.score);
        const finalBoxes = [];
        while (boxes.length > 0) {
          const current = boxes.shift();
          finalBoxes.push(current);
          boxes = boxes.filter(box => calculateIoU(current, box) < iouThreshold);
        }

        // --- 步驟 D：把結果畫到畫布上 ---
        overlayCanvas.width = imageSource.clientWidth;
        overlayCanvas.height = imageSource.clientHeight;
        const ctx = overlayCanvas.getContext('2d');
        ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

        if (finalBoxes.length === 0) {
          statusText.innerText = "ANALYSIS COMPLETE: NO TARGETS FOUND.";
          statusText.style.color = "#ff4c4c";
          return;
        }

        finalBoxes.forEach(box => {
          let detectedName = yoloClasses[box.classId] || "unknown";
          let confidenceText = Math.round(box.score * 100) + "%";

          // 畫框
          ctx.strokeStyle = "#00e5ff";
          ctx.lineWidth = Math.max(2, imageSource.clientWidth / 300);
          ctx.strokeRect(box.x, box.y, box.w, box.h);
          
          // 畫標籤底色
          ctx.fillStyle = "rgba(0, 229, 255, 0.8)";
          ctx.fillRect(box.x, box.y - 25, 140, 25);
          
          // 畫文字
          ctx.fillStyle = "#050a1f";
          ctx.font = "bold 16px Orbitron, sans-serif";
          ctx.fillText(`[${detectedName.toUpperCase()}] ${confidenceText}`, box.x + 5, box.y - 8);
        });

        statusText.innerText = `ANALYSIS COMPLETE: ${finalBoxes.length} TARGET(S) DETECTED.`;
        statusText.style.color = "#00ffcc";

      } catch (e) {
        console.error("Inference Error:", e);
        statusText.innerText = "ANALYSIS FAILED. See console for details.";
      }
    }

    // NMS 使用的交併比計算函數
    function calculateIoU(box1, box2) {
      const xA = Math.max(box1.x, box2.x);
      const yA = Math.max(box1.y, box2.y);
      const xB = Math.min(box1.x + box1.w, box2.x + box2.w);
      const yB = Math.min(box1.y + box1.h, box2.y + box2.h);
      const intersectionArea = Math.max(0, xB - xA) * Math.max(0, yB - yA);
      const box1Area = box1.w * box1.h;
      const box2Area = box2.w * box2.h;
      return intersectionArea / (box1Area + box2Area - intersectionArea);
    }

    // 啟動模型
    loadModel();
  </script>
</body>
</html>
